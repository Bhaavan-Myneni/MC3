name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: 'Generate/refresh visual regression baselines instead of running tests'
        type: boolean
        default: false

jobs:
  test:
    name: Run Playwright test suite (functional, API, cross-browser regression)
    if: ${{ !inputs.update_visual_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Visual regression tests need a committed baseline to compare
      # against (see tests/visual.spec.ts). Until one exists, run every
      # other tag here and generate baselines via the manual
      # "update_visual_baselines" dispatch input below.
      - name: Run Playwright tests (excluding visual regression)
        run: npx playwright test --grep-invert @visual

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 14

  update-visual-baselines:
    name: Generate visual regression baselines
    if: ${{ inputs.update_visual_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate baseline screenshots
        run: npm run test:visual:update

      # Uploaded as an artifact rather than auto-committed: review the
      # screenshots before they become the "source of truth" for every
      # future run, then commit them to tests/visual.spec.ts-snapshots/
      # yourself.
      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: website/tests/**/*-snapshots/**
          retention-days: 14
