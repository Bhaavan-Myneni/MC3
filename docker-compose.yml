services:
  postgres:
    image: postgres:16
    container_name: mc3_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mc3
      POSTGRES_USER: mc3_user
      POSTGRES_PASSWORD: mc3_password
    ports:
      - "5432:5432"
    volumes:
      - mc3_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc3_user -d mc3"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mc3_postgres_data:
